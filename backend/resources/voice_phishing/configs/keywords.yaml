# keywords.yaml — 보이스피싱 규칙 스코어러 사전
# v0.1 · 2026-07-29
#
# 설계 원칙
#   1) 단일 키워드는 변별력이 없다. 정상 은행 상담에도 "이체", "계좌", "인증번호"가 나온다.
#      점수는 "서로 다른 카테고리가 몇 개나 동시에 히트했는가"에서 나온다.
#   2) negative(정상 신호)를 반드시 함께 둔다. 없으면 은행 상담 통화가 전부 오탐난다.
#   3) 사기범은 표현을 계속 바꾼다. 이 사전은 재현율이 아니라 정밀도를 담당한다.
#      우회 표현은 분류기(KoELECTRA)가 맡는다.

version: "0.1"

# 텍스트 정규화 — 매칭 전에 적용
normalize:
  lowercase: true
  strip_spaces: true      # "금 융 감 독 원" 같은 회피 대응
  strip_punctuation: true

# ---------------------------------------------------------------
# 위험 카테고리
#   weight : 해당 카테고리가 1회 이상 히트했을 때의 기본 점수
#   terms  : 부분 문자열 매칭 (정규화 후)
# ---------------------------------------------------------------
categories:

  기관사칭:
    weight: 0.18
    description: 공적 기관 또는 금융기관을 사칭하는 표현
    terms:
      - 국민감독원      # STT 오변형 (실측 1회)
      - 국룡감독원      # 실측 1회
      - 교묘감독원      # STT 오변형 (실측 1회)  
      - 금융감독원
      - 금감원
      - 검찰청
      - 중앙지검
      - 지방검찰청
      - 경찰청
      - 사이버수사대
      - 수사관
      - 특사관          # STT 오변형 (실측 1회)
      - 검사님
      - 담당검사
      - 사건번호
      - 사건에 연루
      - 명의도용
      - 명의가 도용
      - 대포통장
      - 자금세탁
      - 구속영장
      - 출석요구
      - 공문발송

  격리요구:
    weight: 0.30      # 최강 신호. 정상 통화에는 사실상 등장하지 않는다
    description: 상대를 주변 사람·기관으로부터 분리하려는 표현
    terms:
      - 가족에게 말하지
      - 가족한테 말하지
      - 아무에게도 말하지
      - 누구에게도 알리지
      - 말씀하시면 안
      - 발설하시면
      - 수사기밀
      - 기밀유지
      - 비밀유지
      - 통화를 끊지
      - 전화 끊지 마
      - 끊으시면 안
      - 혼자 계신
      - 조용한 곳으로
      - 은행에 가서 말하면
      - 창구직원에게 말하면
      - 주변에 사람

  시간압박:
    weight: 0.16
    description: 지연 시 불이익을 결합한 즉시 행동 요구
    terms:
      - 지금 바로
      - 즉시 처리
      - 당장 하셔야
      - 오늘 안에
      - 시간이 없
      - 늦으면
      - 지연되면
      - 미루시면
      - 계좌가 동결
      - 동결됩니다
      - 불이익을 받
      - 처벌을 받
      - 곧 마감

  행위지시:
    weight: 0.20
    description: 금전 이체·앱 설치·정보 입력 등 구체적 행동 지시
    terms:
      - 안전계좌
      - 보호계좌
      - 국고계좌
      - 이체해주세요
      - 송금해주세요
      - 입금해주세요
      - 앱을 설치
      - 어플 설치
      - 앱 깔아
      - 링크를 눌러
      - 링크 접속
      - 원격제어
      - 원격 프로그램
      - 팀뷰어
      - 애니데스크
      - 인증번호를 알려
      - 인증번호 불러
      - otp
      - 비밀번호를 알려
      - 카드번호를 알려
      - 주민번호를 불러
      - 계좌번호를 불러

# ---------------------------------------------------------------
# 정상 신호 (화이트리스트) — 점수를 깎는다
#   오탐의 대부분은 정상 은행/카드사 상담이다. 여기가 방어선이다.
# ---------------------------------------------------------------
negative:
  weight: -0.12
  description: 정상 상담에서만 나타나는 표현
  terms:
    - 고객센터로 다시
    - 대표번호로 연락
    - 앱에서 직접 확인
    - 홈페이지에서 확인
    - 가까운 지점 방문
    - 영업점에 방문
    - 상담사 연결
    - 녹취되고 있습니다
    - 녹음되고 있습니다
    - 동의하십니까
    - 본인 확인 절차
    - 개인정보 수집 동의
    - 필요하지 않으시면
    - 원하지 않으시면
    - 언제든 취소

# ---------------------------------------------------------------
# 조합 규칙 — 이 사전의 핵심
# ---------------------------------------------------------------
combination:
  # 서로 다른 카테고리가 n개 히트했을 때 곱해지는 배수
  multipliers:
    1: 1.0
    2: 1.8
    3: 2.4
    4: 2.8

  # 특정 조합은 추가 가산 (정상 통화에서 절대 함께 나오지 않는 쌍)
  bonus_pairs:
    - pair: [격리요구, 행위지시]
      bonus: 0.15
    - pair: [기관사칭, 격리요구]
      bonus: 0.15
    - pair: [기관사칭, 행위지시]
      bonus: 0.10

# ---------------------------------------------------------------
# 판정 임계값 — Day 2에 평가셋으로 튜닝할 값
# ---------------------------------------------------------------
thresholds:
  normal_max: 0.45        # 이 미만이면 normal
  suspicious_min: 0.75    # 이 이상이면 suspicious
  # 사이 구간은 unknown → LLM 재판정으로 전달

# 규칙 점수의 상한. 융합식에서 다른 신호를 덮지 않도록 clip
score_cap: 1.0
