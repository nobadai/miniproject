# keywords.yaml — 보이스피싱 규칙 스코어러 사전
# v0.2 · 2026-07-31
#
# 설계 원칙
#   1) 단일 키워드는 변별력이 없다. 정상 은행 상담에도 "이체", "계좌", "인증번호"가 나온다.
#      점수는 "서로 다른 카테고리가 몇 개나 동시에 히트했는가"에서 나온다.
#   2) negative(정상 신호)를 반드시 함께 둔다. 없으면 은행 상담 통화가 전부 오탐난다.
#   3) 사기범은 표현을 계속 바꾼다. 이 사전은 재현율이 아니라 정밀도를 담당한다.
#      우회 표현은 분류기(KoELECTRA)가 맡는다.
#
# v0.2 변경 — 실제 STT 전사본으로 확인한 누락 보강
#   사전이 문어체 녹취록을 보고 만들어져서, STT 출력에서는 걸리는 표현이
#   크게 줄었다. 32분 기관사칭 통화(508 발화)에서 근거가 3개밖에 안 잡혔고
#   격리요구·시간압박은 0건이었다. 두 방향으로 보강했다.
#     - 기관명뿐 아니라 수사 절차 어휘를 추가 ("피해자 입증"이 17회 등장)
#     - 완성형 종결어미 대신 STT 가 실제로 뱉는 잘린 구어체 형태를 추가
#   위험 어휘를 넓힌 만큼 negative 도 함께 넓혀 정밀도를 유지했다.
#   검증: 평가셋 46건에서 정상 통화 오탐 0/23 유지, 피싱 4건 점수 상승.

version: "0.2"

# 텍스트 정규화 — 매칭 전에 적용
normalize:
  lowercase: true
  strip_spaces: true      # "금 융 감 독 원" 같은 회피 대응
  strip_punctuation: true

# ---------------------------------------------------------------
# 위험 카테고리
#   weight : 해당 카테고리가 1회 이상 히트했을 때의 기본 점수
#   terms  : 부분 문자열 매칭 (정규화 후)
# ---------------------------------------------------------------
categories:

  기관사칭:
    weight: 0.18
    description: 공적 기관 또는 금융기관을 사칭하는 표현
    terms:
      - 국민감독원      # STT 오변형 (실측 1회)
      - 국룡감독원      # 실측 1회
      - 교묘감독원      # STT 오변형 (실측 1회)  
      - 금융감독원
      - 금감원
      - 검찰청
      - 중앙지검
      - 지방검찰청
      - 경찰청
      - 사이버수사대
      - 수사관
      - 특사관          # STT 오변형 (실측 1회)
      - 검사님
      - 담당검사
      - 사건번호
      - 사건에 연루
      - 명의도용
      - 명의가 도용
      - 대포통장
      - 자금세탁
      - 구속영장
      - 출석요구
      - 공문발송
      # STT 전사본 실측 보강 — 기관사칭 시나리오의 수사 절차 어휘.
      # 기존 사전은 기관명만 잡아서, 기관명을 한 번만 말하고 이후 30분간
      # 수사 절차를 설명하는 실제 통화에서 근거가 3개밖에 안 걸렸다.
      - 피해자 입증      # 1.mp3 에서 17회. 이 시나리오의 핵심 표현
      - 피해자로 입증
      - 피의자
      - 참고인
      - 조사관
      - 진술서
      - 무혐의
      - 금융범죄
      - 계좌추적
      - 자산동결
      - 수사협조
      - 검찰수사

  격리요구:
    weight: 0.30      # 최강 신호. 정상 통화에는 사실상 등장하지 않는다
    description: 상대를 주변 사람·기관으로부터 분리하려는 표현
    terms:
      - 가족에게 말하지
      - 가족한테 말하지
      - 아무에게도 말하지
      - 누구에게도 알리지
      - 말씀하시면 안
      - 발설하시면
      - 수사기밀
      - 기밀유지
      - 비밀유지
      - 통화를 끊지
      - 전화 끊지 마
      - 끊으시면 안
      - 혼자 계신
      - 조용한 곳으로
      - 은행에 가서 말하면
      - 창구직원에게 말하면
      - 주변에 사람
      # STT 는 문장이 잘리고 구어체로 나와 완성형 종결어미가 잘 안 잡힌다.
      # "가족에게 말하지 마세요" 는 실제로 "말하시면 안 됩니다" 로 전사된다.
      - 말하시면 안
      - 알리시면 안
      - 얘기하시면 안
      - 말씀드리면 안
      - 외부에 알리
      - 타인에게 말
      - 직장에 알려
      - 가족이 알면
      - 함구

  시간압박:
    weight: 0.16
    description: 지연 시 불이익을 결합한 즉시 행동 요구
    terms:
      - 지금 바로
      - 즉시 처리
      - 당장 하셔야
      - 오늘 안에
      - 시간이 없
      - 늦으면
      - 지연되면
      - 미루시면
      - 계좌가 동결
      - 동결됩니다
      - 불이익을 받
      - 처벌을 받
      - 곧 마감
      # 구어체 변형
      - 금일 중
      - 오늘 중으로
      - 시간이 촉박
      - 서둘러
      - 빨리 하셔야

  행위지시:
    weight: 0.20
    description: 금전 이체·앱 설치·정보 입력 등 구체적 행동 지시
    terms:
      - 안전계좌
      - 보호계좌
      - 국고계좌
      - 이체해주세요
      - 송금해주세요
      - 입금해주세요
      - 앱을 설치
      - 어플 설치
      - 앱 깔아
      - 링크를 눌러
      - 링크 접속
      - 원격제어
      - 원격 프로그램
      - 팀뷰어
      - 애니데스크
      - 인증번호를 알려
      - 인증번호 불러
      - otp
      - 비밀번호를 알려
      - 카드번호를 알려
      - 주민번호를 불러
      - 계좌번호를 불러
      # 계좌를 바꿔 부르는 변형과 현금화 지시.
      # "이체하시" 처럼 짧은 어간은 정상 은행 상담에도 흔해서 넣지 않는다.
      - 안전한 계좌
      - 지정된 계좌
      - 지정계좌
      - 현금으로 인출
      - 현금 인출
      - 돈을 찾아서
      - 출금하셔서
      - 보관해 드리
      - 이체하셔야
      - 송금하셔야

# ---------------------------------------------------------------
# 정상 신호 (화이트리스트) — 점수를 깎는다
#   오탐의 대부분은 정상 은행/카드사 상담이다. 여기가 방어선이다.
# ---------------------------------------------------------------
negative:
  weight: -0.12
  description: 정상 상담에서만 나타나는 표현
  terms:
    - 고객센터로 다시
    - 대표번호로 연락
    - 앱에서 직접 확인
    - 홈페이지에서 확인
    - 가까운 지점 방문
    - 영업점에 방문
    - 상담사 연결
    - 녹취되고 있습니다
    - 녹음되고 있습니다
    - 동의하십니까
    - 본인 확인 절차
    - 개인정보 수집 동의
    - 필요하지 않으시면
    - 원하지 않으시면
    - 언제든 취소
    # 위험 어휘를 넓힌 만큼 방어선도 함께 넓힌다.
    # 정상 상담원은 정보를 요구하지 않는다고 먼저 밝히고, 이미 접수된
    # 건을 안내한다. 사기범 화법에는 이 표현들이 나오지 않는다.
    - 요구하지 않습니다
    - 알려드리지 않습니다
    - 접수되었습니다
    - 신청하신
    - 안내드립니다
    - 확인 도와드리

# ---------------------------------------------------------------
# 조합 규칙 — 이 사전의 핵심
# ---------------------------------------------------------------
combination:
  # 서로 다른 카테고리가 n개 히트했을 때 곱해지는 배수
  multipliers:
    1: 1.0
    2: 1.8
    3: 2.4
    4: 2.8

  # 특정 조합은 추가 가산 (정상 통화에서 절대 함께 나오지 않는 쌍)
  bonus_pairs:
    - pair: [격리요구, 행위지시]
      bonus: 0.15
    - pair: [기관사칭, 격리요구]
      bonus: 0.15
    - pair: [기관사칭, 행위지시]
      bonus: 0.10

# ---------------------------------------------------------------
# 판정 임계값 — Day 2에 평가셋으로 튜닝할 값
# ---------------------------------------------------------------
thresholds:
  normal_max: 0.45        # 이 미만이면 normal
  suspicious_min: 0.75    # 이 이상이면 suspicious
  # 사이 구간은 unknown → LLM 재판정으로 전달

# 규칙 점수의 상한. 융합식에서 다른 신호를 덮지 않도록 clip
score_cap: 1.0
