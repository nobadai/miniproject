# 목적: uv로 관리하는 Python Runtime과 Backend Dependency를 선언한다.
# 주요 역할: FastAPI 애플리케이션의 재현 가능한 Dependency 정보를 제공한다.

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi[standard]>=0.140.13",
    "faster-whisper>=1.2.1",
    "google-genai>=2.16.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "selenium>=4.29,<5",
    "torch>=2.13",
    "transformers>=4.48,<6",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
