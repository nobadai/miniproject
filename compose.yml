# 목적: 팀 공통 Local Container 환경을 정의한다.
# 주요 역할: Frontend, Backend, pgvector 기반 PostgreSQL을 함께 실행한다.

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: database
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
    # 기본 Backend Image는 Local Compose를 위한 CPU 전용 Image다.
    # GPU 추론은 CUDA용 Dependency와 Compose 구성을 별도로 사용해야 한다.
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
      # 전사 캐시는 Container 재시작 후에도 남아야 재업로드가 빨라진다.
      - ./backend/cache:/app/cache
      # 업로드 원본은 Database Row 가 가리키는 실체이므로 Container 밖에 둔다.
      - ./backend/uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:0.8.5-pg18
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
