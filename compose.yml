# 목적: 팀 공통 Local Container 환경을 정의한다.
# 주요 역할: Frontend, Backend, pgvector 기반 PostgreSQL을 함께 실행한다.

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    # Server Component의 fetch는 Browser가 아니라 이 Container 안(Node.js)에서
    # 실행되므로, Browser 기준 주소(NEXT_PUBLIC_API_BASE_URL)가 아니라 Container 간
    # 통신 주소를 따로 전달한다. frontend/utils/api_client.ts가 Server 실행
    # 환경에서 이 값을 우선 사용한다.
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: database
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
    # 기본 Backend Image는 Local Compose를 위한 CPU 전용 Image다.
    # GPU 추론은 CUDA용 Dependency와 Compose 구성을 별도로 사용해야 한다.
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
      # 전사 캐시는 Container 재시작 후에도 남아야 재업로드가 빨라진다.
      - ./backend/cache:/app/cache
      # 업로드 원본은 Database Row 가 가리키는 실체이므로 Container 밖에 둔다.
      - ./backend/uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:0.8.5-pg18
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # 초기화 SQL은 Volume이 처음 생성될 때 파일명 알파벳순으로 한 번만 실행된다.
      # 하위 Directory는 실행되지 않으므로 파일 단위로 마운트하며,
      # Schema가 Seed보다 먼저 실행되도록 Container 안 파일명으로 순서를 고정한다.
      # 다시 실행하려면 docker compose down --volumes 로 Volume을 지운다.
      - ./database/schemas/0001_enable_vector.sql:/docker-entrypoint-initdb.d/10_enable_vector.sql:ro
      - ./database/schemas/0002_create_voice_phishing_tables.sql:/docker-entrypoint-initdb.d/20_create_voice_phishing_tables.sql:ro
      - ./database/schemas/0003_create_users.sql:/docker-entrypoint-initdb.d/21_create_users.sql:ro
      - ./database/schemas/0004_create_news_tables.sql:/docker-entrypoint-initdb.d/22_create_news_tables.sql:ro
      - ./database/schemas/0005_create_fraud_analysis_tables.sql:/docker-entrypoint-initdb.d/23_create_fraud_analysis_tables.sql:ro
      - ./database/schemas/0006_add_user_id_to_analysis_tables.sql:/docker-entrypoint-initdb.d/24_add_user_id_to_analysis_tables.sql:ro
      - ./database/seeds/0001_news_articles.sql:/docker-entrypoint-initdb.d/30_news_articles.sql:ro
      - ./database/seeds/0002_news_summaries.sql:/docker-entrypoint-initdb.d/31_news_summaries.sql:ro
      - ./database/seeds/0003_news_sentiments.sql:/docker-entrypoint-initdb.d/32_news_sentiments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
