# 목적: 팀 공통 Local Container 환경을 정의한다.
# 주요 역할: Frontend, Backend, pgvector 기반 PostgreSQL을 함께 실행한다.

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: database
    # GPU가 없는 환경에서도 기동되어야 하므로 기본값에서 뺀다.
    # NVIDIA GPU와 Container Toolkit이 준비된 환경에서는 아래를 켜면
    # STT와 KoELECTRA 추론이 크게 빨라진다.
    # gpus: all
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
      # 전사 캐시는 Container 재시작 후에도 남아야 재업로드가 빨라진다.
      - ./backend/cache:/app/cache
    depends_on:
      database:
        condition: service_healthy

  database:
    image: pgvector/pgvector:0.8.5-pg18
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
